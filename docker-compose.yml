services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: voice_agents
      POSTGRES_PASSWORD: voice_agents
      POSTGRES_DB: voice_agents
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U voice_agents"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app

  dashboard:
    build: ./dashboard
    ports:
      - "3000:3000"
    env_file:
      - ./dashboard/.env.local
    depends_on:
      - backend
    volumes:
      - ./dashboard/src:/app/src

volumes:
  pgdata:
